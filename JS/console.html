<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive JavaScript Output Example</title>
</head>
<body>
    <h1>JavaScript Loop Example</h1>
    <p>Click the button to see the output.</p>
    <button onclick="showOutput()">Show Output</button>

    <script>
        // Display output in the console when the button is clicked
        function showOutput() {
            for (let i = 1; i <= 5; i++) {
                console.log(i);
            }
        }
    </script>
</body>
</html>
