<!DOCTYPE html>
<html>
<head>
  <title>To-Do List</title>
  <link href="Sample.css" rel = "stylesheet">
</head>
<body>
  <h1>To-Do List</h1>
  <input id="task" type="text" placeholder="Enter task">
  <button id="add-task">Add Task</button>
  <ul id="task-list"></ul>

  <script>
    let taskList = document.getElementById("task-list");
    let addTaskButton = document.getElementById("add-task");
    let taskInput = document.getElementById("task");

    addTaskButton.addEventListener("click", addTask);

    function addTask() {
      let task = taskInput.value.trim();
      if (task !== "") {
        let taskItem = document.createElement("li");
        taskItem.textContent = task;
        taskList.appendChild(taskItem);

        // Animate the new task item
        taskItem.style.opacity = 0;
        taskItem.style.transform = "scale(0)";
        setTimeout(function() {
          taskItem.style.opacity = 1;
          taskItem.style.transform = "scale(1)";
        }, 100);
        // Clear the input field
        taskInput.value = "";
        // Show an alert
        alert(`Task "${task}" added!`);
      }
    }
  </script>
</body>
</html>


In this updated version:

- When a new task is added, the task item is animated to fade in and scale up.
- When a new task is added, an alert is shown to confirm that the task has been added.
