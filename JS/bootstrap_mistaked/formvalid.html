<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ❌ mistake -->
  <meta name="viewport" content="width=device-width initial-scale=1.0">
  <title>Forms & Validation – Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .demo-box { border: 1px dashed #ccc; padding: 1rem; }
  </style>
</head>
<body>

<header class="py-3 bg-secondary text-white">
  <div class="container">
    <h1 class="h3 mb-0">Forms & Validation</h1>
  </div>
</header>

<main class="container my-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <!-- ❌ mistake -->
      <form class="needs-validaton demo-box" novalidate>
        <div class="mb-3">
          <label for="fullName" class="form-label">Full name</label>
          <!-- ❌ mistake -->
          <input type="text" class="form-contrl" id="fullName" required placeholder="Alex Johnson">
          <div class="invalid-feedbak">Please enter your full name.</div> <!-- ❌ mistake -->
        </div>

        <div class="mb-3">
          <label for="emailAddress" class="form-label">Email address</label>
          <!-- ❌ mistake -->
          <input type="emali" class="form-control" id="emailAdress" required> <!-- ❌ mistake -->
          <div class="form-text">We'll never share your email.</div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="program" class="form-label">Program</label>
            <!-- ❌ mistake -->
            <select id="program" class="form-selet" required>
              <option value="">Choose…</option>
              <option>Full Stack</option>
              <option>Data Science</option>
              <option>AI & Cloud</option>
            </select>
            <div class="invalid-feedback">Select a program.</div>
          </div>
          <div class="col-md-6 mb-3">
            <label for="age" class="form-label">Age</label>
            <input id="age" type="number" class="form-control" min="16" max="100" required>
            <div class="invalid-feedback">Enter a valid age (16–100).</div>
          </div>
        </div>

        <div class="form-check mb-3">
          <!-- ❌ mistake -->
          <input class="form-check-imput" type="checkbox" id="agree" required="true"> <!-- ❌ mistake -->
          <label class="form-check-label" for="agrees">I agree to terms</label> <!-- ❌ mistake -->
        </div>

        <!-- ❌ mistake -->
        <button class="btn btn-succes w-100" type="submit">Submit</button>
      </form>
    </div>
  </div>
</main>

<footer class="py-4 bg-dark text-white text-center">
  <small>© Forms Demo</small>
</footer>

<script>
  // basic client-side validation trigger
  (function () {
    'use strict';
    const forms = document.querySelectorAll('.needs-validaton'); // ❌ mistake
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        // ❌ mistake
        form.classList.add('was-validted');
      }, false);
    });
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
