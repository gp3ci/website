<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- ❌ mistake -->
  <meta name="viewport" content="width=device-width, initial=1.0">
  <title>Carousel – Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="py-3 bg-dark text-white">
  <div class="container">
    <h1 class="h3 mb-0">Carousel Showcase</h1>
  </div>
</header>

<main class="container my-4">
  <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel"> <!-- ❌ mistake -->
    <div class="carousel-inner"> <!-- ❌ mistake -->
      <div class="carousel-item active">
        <!-- ❌ mistake -->
        <img src="https://picsum.photos/id/1015/1200/500" class="d-block w-100" alt="Slide 1">
        <div class="carousel-caption d-none d-md-block">
          <h5>Mountain View</h5>
          <p>Explore the peaks and valleys.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/id/1016/1200/500" class="d-block w-100" alt="Slide 2">
        <div class="carousel-caption d-none d-md-block">
          <h5>Forest Path</h5>
          <p>Walk through quiet trails.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/id/1021/1200/500" class="d-block w-100" alt="Slide 3">
        <div class="carousel-caption d-none d-md-block">
          <h5>Coastal Sunset</h5>
          <p>Relax by the shore.</p>
        </div>
      </div>
    </div>

    <!-- Indicators -->
    <div class="carousel-indicators">
      <!-- ❌ mistake: id mismatch -->
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
    </div>

    <!-- Controls -->
    <!-- ❌ mistake: id mismatch -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <!-- ❌ mistake -->
    <button class="carousel-control-next" type="button" data-bs-target="mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</main>

<footer class="py-4 bg-dark text-white text-center">
  <small>© Carousel Demo</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
