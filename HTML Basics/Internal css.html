<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS Example</title>
    <style>
        h1 {
            color: blue;
            font-size: 24px;
        }
        p {
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Internal CSS</h1>
    <p>This paragraph is styled using internal CSS.</p>
</body>
</html>
