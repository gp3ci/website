<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration</title>
</head>
<body>
  <h1>Student Registration Form</h1>

  <!-- Table to show registered students (sample data) -->
  <table border="1" cellpadding="8" cellspacing="0">
    <caption><strong>Registered Students</strong></caption>
    <thead>
      <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Department</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>101</td>
        <td>Alice</td>
        <td>CSE</td>
        <td>alice@example.com</td>
      </tr>
      <tr>
        <td>102</td>
        <td>Bob</td>
        <td>ECE</td>
        <td>bob@example.com</td>
      </tr>
    </tbody>
  </table>

  <hr />

  <!-- HTML5 Form with validation -->
  <form action="/submit" method="post">
    <label for="roll">Roll Number:</label>
    <input type="number" id="roll" name="roll" required /><br /><br />

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required minlength="3" maxlength="30" /><br /><br />

    <label for="dept">Department:</label>
    <select id="dept" name="dept" required>
      <option value="">--Select--</option>
      <option value="CSE">CSE</option>
      <option value="ECE">ECE</option>
      <option value="MECH">MECH</option>
    </select><br /><br />

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required /><br /><br />

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" 
    required pattern=".{6,}" title="Minimum 6 characters" /><br /><br />

    <input type="submit" value="Register" />
  </form>
</body>
</html>
