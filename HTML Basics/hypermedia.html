<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypermedia Elements Example</title>
</head>
<body>
      <header>
        <h1>Welcome to My Website</h1>
    </header>

  <h1>Hypermedia Elements in HTML</h1>

  <!-- LINK -->
  <section>
    <h2>1. Link (<code>&lt;a&gt;</code>)</h2>
    <p>Visit <a href="https://www.wikipedia.org" target="_blank">
        Wikipedia</a> for more information.</p>
  </section>

  <!-- IMAGE -->
  <section>
    <h2>2. Image (<code>&lt;img&gt;</code>)</h2>
    <img src="your_url.jpg" alt="HTML5 Logo" width="200">
  </section>

  <!-- IFRAME -->
  <section>
    <h2>3. Iframe (<code>&lt;iframe&gt;</code>)</h2>
    <p>Embedded YouTube Video:</p>
    <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/UB1O30fR-EE" 
    title="HTML Crash Course" frameborder="0" allowfullscreen></iframe>
  </section>

  <!-- EMBED -->
  <section>
    <h2>4. Embed (<code>&lt;embed&gt;</code>)</h2>
    <p>Embedded PDF File:</p>
    <embed src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
     width="600" height="400" type="application/pdf">
  </section>

  <!-- VIDEO -->
  <section>
    <h2>5. Video (<code>&lt;video&gt;</code>)</h2>
    <video width="400" controls>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>
    <footer>
        <p>&copy; 2025 Your Name. All rights reserved.</p>
    </footer>
</body>
</html>
