<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
</head>
<body>
    <h1 style="color: darkblue; text-align: center; 
    text-decoration: underline; text-transform: uppercase; 
    letter-spacing: 2px; word-spacing: 4px;">
        CSS Styling Example
    </h1>
    <p style="font-family: Arial, sans-serif; font-size: 16px; 
    font-weight: bold; font-style: italic; line-height: 1.5;">
        This is an example paragraph showing various CSS text and font properties.
    </p>
    <div style="border: 2px solid black; border-top: 3px dashed red;
     border-right: 4px dotted blue; border-bottom: 5px double green;
      border-left: 6px groove purple; border-radius: 8px; margin: 20px; padding: 15px; width: 200px; height: 100px; background-color: lightgray;">
        This box demonstrates border, padding, and margin.
    </div>
</body>
</html>
