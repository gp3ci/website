<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Concepts Demo</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Welcome to CSS Demo Page</h1>
  <p>This page demonstrates CSS concepts using variables, flexbox,
     grid, and more.</p>
  <!-- Flexbox container -->
  <div class="container">
    <div class="card">Flex Item 1</div>
    <div class="card">Flex Item 2</div>
    <div class="card">Flex Item 3</div>
  </div>

  <!-- Grid layout -->
  <div class="grid-layout">
    <div class="card">Grid 1</div>
    <div class="card">Grid 2</div>
    <div class="card">Grid 3</div>
    <div class="card">Grid 4</div>
  </div>
  <!-- Form controls -->
  <form style="margin: 20px;">
    <input type="text" 
    placeholder="Focus me" style="padding: 8px;
     border: 1px solid #ccc;">
    <button type="submit">Click Me</button>
  </form>

  <!-- Link with hover -->
  <p>
    Visit <a href="https://example.com">Example</a> to test
     hover color.
  </p>
</body>
</html>
